<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="This page acts as the landing point for users and is the first thing they will see.">
    <meta name="author" content="Makay Raddatz">
    <title>Home | Whitewater Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap"
      rel="stylesheet">
</head>

<body>
    <header>
        <img src="images/rafting-logo.jpg" alt="Rafting Logo">
        <nav class="button_bar">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="hero">
            <h1>Travel To The Edge: Rafting Adventures</h1>
            <img src="images/epic-rafting.webp" alt="Epic Rapid">
        </div>
        <div class="home_message">
            <p>Have you seen The Edge?</p>
        </div>
        <fieldset class="newsletter">
            <form>
                <h2>Want to know the latest adventures?</h2>
                <label for="username">Name:</label>
                <input type="text" id="username" name="username">

                <label for="useremail">Email:</label>
                <input type="text" id="useremail" name="useremail">

                <button type="submit">Join the adventure!</button>
            </form>
        </fieldset>
        <div class="midbar">
            <section class="services">
                <h3>Food and Lodging</h3>
                <figure>
                    <img src="images/hotel.webp" alt="Hotel Icon" width="50">
                </figure>
            </section>
            <a href="trips.html">
                <section class="alt_trips">
                    <h3>Ready for adventure?</h3>
                    <img src="images/paddle-icon.webp" alt="Paddle Icon" width="50">
                </section>
            </a>
            <section class="services">
                <h3>Photography</h3>
                <figure>
                    <img src="images/camera.webp" alt="Camera Icon" width="50">
                </figure>
            </section>
        </div>

    </main>

    <footer>
        <p> ©2026 🏝️ Travel to The Edge Rafting Adventures 🏝️ Makay Raddatz</p>
        <nav class="socialmedia">
            <a href="https://www.instagram.com/">
                <img src="images/rafting-insta.svg" alt="Instagram Logo" width=40>
            </a>
            <a href="https://www.facebook.com/">
                <img src="images/rafting-fb.svg" alt="Facebook Logo" width=40>
            </a>
            <a href="https://www.pinterest.com/">
                <img src="images/rafting-pintrest.svg" alt="Pinterest Logo" width=40>
            </a>
        </nav>
    </footer>
</body>

</html>
