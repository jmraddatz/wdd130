<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="This page provides information on how to contact Travel to the Edge Rafting Adventures">
    <meta name="author" content="Makay Raddatz">
    <title>Contact Us | Whitewater Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rafting-logo.jpg" alt="Rafting Logo">
        <nav class="button_bar">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="hero">
            <h1>Travel to the Edge: Rafting Adventures</h1>
        </div>
        <div class="info">
            <p>522 South River Way</p>
            <p>Orem, Utah</p>
            <p>+1 777 777 7777</p>
            <p>traveltotheedge@whitewater.com</p>
        </div>

        <div class="map">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6067.67009649919!2d-111.44915694622529!3d40.501030494260846!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x874d9a86c225b48f%3A0x3e9d750ccc30098a!2sProvo%20River!5e0!3m2!1sen!2sus!4v1791256902775!5m2!1sen!2sus"
              width=390 height=350 allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>

        <form>
            <label for="name">Name:</label>
            <input type="text" name="name" id="name" placeholder="First and Last">

            <label for="email">Email:</label>
            <input type="text" name="email" id="email" placeholder="Email">
            <div class="purpose">

                <p>Why are you contacting us today?</p>

                <label for="general">General Inquiry</label>
                <input type="radio" id="general" name="purpose" value="General Inquiry">

                <label for="reservation">Reservation Question</label>
                <input type="radio" id="reservation" name="purpose" value="Reservation Question">

                <label for="website">Website Suggestion</label>
                <input type="radio" id="website" name="purpose" value="Website Suggestion">
            </div>

            <textarea id="message" name="message" rows="4"
              placeholder="Enter your request here"></textarea>
            <label for="message">Message:</label>

            <input type="checkbox" id="subscribe" name="subscribe">
            <label for="subscribe">Please subscribe me to the monthly newsletter</label>


            <div class="button">
                <button type="submit">Submit Request</button>
            </div>
        </form>

        <section>
            <div class="employee">
                <img src="images/employee1.webp" alt="John" width="150">
                <img src="images/employee2.webp" alt="Anna" width="150">
                <img src="images/employee3.webp" alt="Kristy" width="150">
            </div>
        </section>
    </main>
    <footer>
        <p> ©2026 🏝️ Travel to The Edge Rafting Adventures 🏝️ Makay Raddatz</p>
        <nav class="socialmedia">
            <a href="https://www.instagram.com/">
                <img src="images/rafting-insta.svg" alt="Instagram Logo" width=40>
            </a>
            <a href="https://www.facebook.com/">
                <img src="images/rafting-fb.svg" alt="Facebook Logo" width=40>
            </a>
            <a href="https://www.pinterest.com/">
                <img src="images/rafting-pintrest.svg" alt="Pinterest Logo" width=40>
            </a>
        </nav>
    </footer>
</body>

</html>
